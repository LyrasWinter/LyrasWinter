<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyra Winter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pink: #e8a0b4;
    --pink-hot: #d4607a;
    --black: #080808;
    --off: #111111;
    --text: #c8a0b0;
    --dim: #5a3545;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--black);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    overflow-x: hidden;
    cursor: crosshair;
  }

  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    opacity: 0.6;
  }

  body::after {
    content: '';
    position: fixed; inset: 0; z-index: 1;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.15) 2px,
      rgba(0,0,0,0.15) 4px
    );
    pointer-events: none;
    animation: scanroll 8s linear infinite;
  }

  @keyframes scanroll {
    from { background-position: 0 0; }
    to { background-position: 0 400px; }
  }

  #intro {
    position: fixed; inset: 0; z-index: 100;
    background: var(--black);
    display: flex; align-items: center; justify-content: center;
    animation: introFade 0.4s ease 3.2s forwards;
  }

  @keyframes introFade {
    to { opacity: 0; pointer-events: none; }
  }

  .glitch-wrap {
    position: relative;
    width: min(420px, 80vw);
    animation: glitchSeq 3s ease forwards;
  }

  .glitch-wrap img {
    width: 100%;
    display: block;
    position: relative;
    z-index: 2;
    opacity: 0;
    animation: logoReveal 0.1s steps(1) 0.3s forwards;
  }

  }

  @keyframes logoReveal {
    to { opacity: 1; }
  }

  @keyframes rgbR {
    0%   { opacity: 0; transform: translateX(0); }
    10%  { opacity: 0.9; transform: translateX(-12px); }
    15%  { opacity: 0; transform: translateX(8px); }
    25%  { opacity: 0.7; transform: translateX(-6px); }
    35%  { opacity: 0; }
    50%  { opacity: 0.5; transform: translateX(-4px); }
    70%  { opacity: 0; }
    80%  { opacity: 0.3; transform: translateX(-2px); }
    100% { opacity: 0; transform: translateX(0); }
  }

  @keyframes rgbB {
    0%   { opacity: 0; transform: translateX(0); }
    10%  { opacity: 0.9; transform: translateX(12px); }
    15%  { opacity: 0; transform: translateX(-8px); }
    25%  { opacity: 0.7; transform: translateX(6px); }
    35%  { opacity: 0; }
    50%  { opacity: 0.5; transform: translateX(4px); }
    70%  { opacity: 0; }
    80%  { opacity: 0.3; transform: translateX(2px); }
    100% { opacity: 0; transform: translateX(0); }
  }

  .glitch-bar {
    position: absolute; z-index: 4;
    left: 0; right: 0;
    background: var(--pink-hot);
    mix-blend-mode: overlay;
    height: 3px;
    opacity: 0;
  }

  .glitch-bar:nth-child(1) { top: 30%; animation: bar 3s ease forwards; animation-delay: 0.4s; }
  .glitch-bar:nth-child(2) { top: 55%; animation: bar 3s ease forwards; animation-delay: 0.7s; }
  .glitch-bar:nth-child(3) { top: 70%; animation: bar 3s ease forwards; animation-delay: 1.1s; height: 1px; }

  @keyframes bar {
    0%  { opacity: 0; transform: scaleX(0) translateX(-20px); }
    5%  { opacity: 1; transform: scaleX(1.2) translateX(10px); }
    10% { opacity: 0.6; transform: scaleX(0.8) translateX(-5px); }
    15% { opacity: 0; }
    60% { opacity: 0; }
    62% { opacity: 0.4; transform: scaleX(0.4) translateX(30px); }
    65% { opacity: 0; }
    100% { opacity: 0; }
  }

  #main {
    position: relative; z-index: 2;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 60px 24px 80px;
    opacity: 0;
    animation: mainIn 0.8s ease 3.4s forwards;
  }

  @keyframes mainIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo-static {
    width: min(280px, 65vw);
    margin-bottom: 8px;
    filter: drop-shadow(0 0 24px rgba(212,96,122,0.3));
    transition: filter 0.3s;
  }

  .logo-static:hover {
    filter: drop-shadow(0 0 40px rgba(212,96,122,0.6));
    animation: subtleGlitch 0.3s steps(1) forwards;
  }

  @keyframes subtleGlitch {
    0%  { transform: translateX(0); filter: drop-shadow(0 0 40px rgba(212,96,122,0.6)); }
    25% { transform: translateX(-3px); filter: drop-shadow(-4px 0 0 rgba(255,0,80,0.5)) drop-shadow(4px 0 0 rgba(0,200,255,0.5)); }
    50% { transform: translateX(3px); }
    75% { transform: translateX(-1px); }
    100% { transform: translateX(0); filter: drop-shadow(0 0 40px rgba(212,96,122,0.6)); }
  }

  .wordmark {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(28px, 6vw, 48px);
    letter-spacing: 0.35em;
    color: var(--pink);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .tagline {
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 56px;
  }

  .links {
    display: flex; flex-direction: column; gap: 16px;
    width: 100%; max-width: 380px;
  }

  .link-item {
    position: relative;
    display: flex; align-items: center; gap: 16px;
    padding: 14px 20px;
    border: 1px solid var(--dim);
    background: rgba(232,160,180,0.03);
    text-decoration: none;
    color: var(--text);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    transition: all 0.2s;
    overflow: hidden;
  }

  .link-item::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 2px;
    background: var(--pink-hot);
    transform: scaleY(0);
    transition: transform 0.2s;
    transform-origin: bottom;
  }

  .link-item:hover {
    border-color: var(--pink);
    color: var(--pink);
    background: rgba(232,160,180,0.06);
    transform: translateX(4px);
  }

  .link-item:hover::before { transform: scaleY(1); }

  .link-item:hover .link-label {
    animation: textGlitch 0.2s steps(1) forwards;
  }

  @keyframes textGlitch {
    0%  { clip-path: none; }
    30% { clip-path: inset(20% 0 50% 0); transform: translateX(-4px); }
    60% { clip-path: inset(60% 0 10% 0); transform: translateX(4px); }
    100% { clip-path: none; transform: translateX(0); }
  }

  .link-icon {
    width: 18px; height: 18px;
    flex-shrink: 0;
    opacity: 0.7;
  }

  .link-item:hover .link-icon { opacity: 1; }

  .cursor-blink {
    display: inline-block;
    width: 6px; height: 10px;
    background: var(--pink);
    margin-left: 6px;
    vertical-align: middle;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  footer {
    margin-top: 64px;
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--dim);
    text-align: center;
    text-transform: uppercase;
  }
</style>

    </filter>
    <filter id="blueShift">

    </filter>

</svg>
